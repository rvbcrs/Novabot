# OpenNova: self-hosted replacement for the Novabot cloud.
#
# One line to change: TARGET_IP. Then `docker compose up -d`.
# Admin panel: http://TARGET_IP/admin
# Everything else is on the wiki: https://wiki.ramonvanbruggen.nl/guide/docker/

services:
  opennova:
    image: rvbcrs/opennova:latest
    container_name: opennova
    restart: unless-stopped
    init: true
    ports:
      - "80:80"       # HTTP: API, admin panel, dashboard
      - "443:443"     # HTTPS: required by the official Novabot app
      - "1883:1883"   # MQTT: mower and charger connect here
      - "53:53/udp"   # built-in DNS: answers *.lfibot.com with TARGET_IP
    environment:
      # Timezone: must match the timezone used by the app when creating
      # schedules, otherwise they run at the wrong hour.
      TZ: Europe/Amsterdam
      PORT: 80
      DB_PATH: /data/novabot.db
      STORAGE_PATH: /data/storage
      FIRMWARE_PATH: /data/firmware
      ENABLE_TLS: "true"
      ENABLE_DASHBOARD: "true"
      TARGET_IP: 192.168.1.50        # <-- CHANGE THIS to this machine's LAN IP

      # Built-in DNS: set TARGET_IP as the DNS server in your router and the
      # mower finds the server. Port 53 must be free on this machine. Doing
      # the rewrite in your router or Pi-hole instead? Set this to "false"
      # and drop the 53:53/udp port above.
      ENABLE_DNS: "true"
      UPSTREAM_DNS: 8.8.8.8          # where every other name is forwarded

      # mDNS is done by opennova-mdns below
      ENABLE_MDNS: "false"
      MDNS_SIDECAR: "true"

      # ── Optional: Home Assistant ──────────────────────────────────────
      # Remove the # and fill in your own values. Sensors and the map image
      # appear in HA through MQTT discovery.
      # HA_MQTT_HOST: 192.168.1.10     # your Home Assistant MQTT broker
      # HA_MQTT_PORT: 1883
      # HA_MQTT_USER: mqtt             # broker user
      # HA_MQTT_PASS: secret           # broker password
      # RENDER_BASE_URL: http://192.168.1.50   # this server, so HA can fetch the map image
      # HA_WEBHOOK_URL: http://192.168.1.10:8123/api/webhook/opennova   # every event as JSON

      # ── Optional: push notifications via ntfy.sh ──────────────────────
      # NTFY_TOPIC: opennova-a-long-random-string   # topics are public, pick a random one
      # NTFY_URL: https://ntfy.sh
      # LOW_BATTERY_THRESHOLD: 20      # battery % for the low-battery notification

      # ── Optional: firmware downloads through a proxy or other port ───
      # OTA_BASE_URL: http://192.168.1.50:8080
    volumes:
      - ./data:/data

  # Advertises opennova.local on your LAN so mowers with custom firmware find
  # the server by name. Nothing to configure. On Docker Desktop it exits by
  # itself (see the wiki, "Where will it run?").
  opennova-mdns:
    image: rvbcrs/opennova:latest
    container_name: opennova-mdns
    restart: on-failure
    network_mode: host
    environment:
      MDNS_ONLY: "true"
      TZ: Europe/Amsterdam
